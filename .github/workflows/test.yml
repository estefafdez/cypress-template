name: Test
on:
  workflow_dispatch:
  workflow_call:
  push:
permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Replace secrets on the project.
      - name: Replace Cypress Dashboard API Key secret on the package.json
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: '{CYPRESS_DASHBOARD_APIKEY}'
          replace: ${{ secrets.CYPRESS_DASHBOARD_APIKEY }}

      - name: Replace Qase API Token secret on the package.json
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: '{QASE_API_TOKEN}'
          replace: ${{ secrets.QASE_API_TOKEN }}

      # Clean node modules
      - name: Clean node modules
        run: npm cache clean --force

      # Install NPM dependencies, cache them correctly
      - name: Install dependencies
        run: npm install --force

      # Verify Cypress binary
      - name: Verify Cypress
        run: npm run verify

      # Run all Cypress tests
      # Dependabot PRs cannot read the repository secrets, so there is no Cypress
      # Dashboard key to record with. Run the specs locally in that case.
      - name: Run the tests
        env:
          CYPRESS_DASHBOARD_APIKEY: ${{ secrets.CYPRESS_DASHBOARD_APIKEY }}
        run: |
          if [ -n "$CYPRESS_DASHBOARD_APIKEY" ]; then
            npm run test
          else
            npm run compile
            ELECTRON_EXTRA_LAUNCH_ARGS=--remote-debugging-port=9222 npx cypress run --env configFile=qa
          fi

      # Upload artifacts with the tests results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: report
          path: report

      # Upload artifacts with the tests results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debugger
          path: dump

      # Publish Test Results
      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: report/*.xml
