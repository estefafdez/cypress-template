version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Cypress loads the TypeScript JS API, which TypeScript 7 does not ship.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
